name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  plugin:
    name: SimpleSC / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: fpc, os: windows-latest, release: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: nsis-dev/build-plugin@main
        with:
          name: SimpleSC
          toolchain: ${{ matrix.toolchain }}
          release: ${{ matrix.release }}
          project: Contrib/SimpleSC/SimpleSC.dpr
          targets: x86-ansi,x86-unicode,amd64-unicode
